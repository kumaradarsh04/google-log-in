<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Login Demo</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			max-width: 480px;
			margin: 80px auto;
			text-align: center;
			color: #202124;
		}

		#g_id_signin {
			display: flex;
			justify-content: center;
			margin-top: 24px;
		}

		#profile {
			display: none;
			margin-top: 24px;
			padding: 24px;
			border: 1px solid #e0e0e0;
			border-radius: 12px;
		}

		#profile img {
			width: 72px;
			height: 72px;
			border-radius: 50%;
		}

		#signout-btn {
			margin-top: 16px;
			padding: 8px 16px;
			border: 1px solid #dadce0;
			border-radius: 4px;
			background: white;
			cursor: pointer;
		}

		#signout-btn:hover {
			background: #f5f5f5;
		}

		#error {
			color: #d93025;
			margin-top: 16px;
			display: none;
		}
    </style>
</head>

<body>

    <h1>Google Login Demo</h1>

    <div id="login-section">
        <div id="g_id_onload"
            data-client_id="215614999054-8seuea0iui18ic4cvnnlp6ko707f1tck.apps.googleusercontent.com"
            data-callback="handleCredentialResponse"> </div>
        <div class="g_id_signin"></div>
    </div>

    <div id="profile" style="display:none;">

        <h2>Welcome!</h2>

        <img id="profile-picture" width="100" height="100" referrerpolicy="no-referrer">

        <p id="profile-name"></p>
        <p id="profile-email"></p>

        <button onclick="logout()">Logout</button>

    </div>


    <script src="app.js"></script>

</body>

</html>
